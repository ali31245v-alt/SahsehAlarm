name: Build and publish Sahseh APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sahseh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sahseh-debug-apk
          path: Sahseh.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sahseh APK build ${{ github.run_number }}
          make_latest: true
          files: Sahseh.apk
